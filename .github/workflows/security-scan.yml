name: Security Scan

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python scanners
        run: pip install semgrep bandit

      - name: Run Semgrep
        run: |
          semgrep \
            --config auto \
            --json \
            --output semgrep.json \
            .

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Bandit
        run: |
          bandit -r . \
            -f json \
            -o bandit.json \
            --exclude .git,results \
            || true

      - name: Run OSV-Scanner
        run: |
          curl -sSfL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan source \
            --recursive \
            --format json \
            --output-file osv-scanner.json \
            --lockfile requirements.txt:test_cases/vulnerable_requirements.txt \
            . \
            || true
